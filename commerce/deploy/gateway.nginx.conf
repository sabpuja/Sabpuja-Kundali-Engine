# KUN-RC-COM-001 gateway. PREPARED ONLY. Shares the commerce container's network namespace and
# forwards internal :8081 to the loopback-only service on 127.0.0.1:8770.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;   # warn/error lines would carry client addresses and request lines
events { worker_connections 256; }
http {
    access_log off;                       # no URLs, bodies or addresses are logged
    server_tokens off;
    client_body_temp_path /tmp/body; proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s;
    client_body_buffer_size 256k;         # bodies stay in memory, never in a temp file
    client_body_timeout 10s; client_header_timeout 10s; send_timeout 30s; keepalive_timeout 15s;
    include /etc/nginx/trusted-proxy.conf;
    real_ip_header X-Forwarded-For;
    limit_req_zone $binary_remote_addr zone=general:5m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=claim:5m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=report:5m rate=2r/m;
    limit_req_status 429;
    limit_req_log_level info; limit_conn_log_level info;
    limit_conn_zone $binary_remote_addr zone=perip:5m;
    server {
        listen 8081;
        limit_conn perip 10;
        client_max_body_size 4k;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        location = /webhooks/shopify { client_max_body_size 256k; limit_req zone=general burst=40; proxy_pass http://127.0.0.1:8770; }
        location ^~ /api/claim/      { limit_req zone=claim burst=5 nodelay; proxy_pass http://127.0.0.1:8770; }
        location = /api/generate     { limit_req zone=report burst=2 nodelay; proxy_pass http://127.0.0.1:8770; }
        location /                   { limit_req zone=general burst=40; proxy_pass http://127.0.0.1:8770; }
    }
}

# KUN-RC-COM-001. PREPARATION ONLY. Do not start on shared infrastructure, attach to the live edge,
# or point a Shopify webhook at it without separate owner authorization.
# Resource limits keep it from starving the owner-only preview on the same host.
name: sabpuja-kundali-commerce-staging
services:
  commerce:
    build:
      context: ../..
      dockerfile: commerce/deploy/Dockerfile
    image: sabpuja-kundali-commerce:staging
    read_only: true
    user: "10002:10002"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      SABPUJA_EPHE_PATH: /opt/kundali/ephe
    volumes:
      - {type: bind, source: "${SBK_EPHE_DIR:?verified ephemeris directory}", target: /opt/kundali/ephe, read_only: true}
      - {type: bind, source: "${SBK_SECRETS_DIR:?directory with commerce.json, smtp.json and secret files}", target: /run/sabpuja, read_only: true}
      # The entitlement database: order ids and keyed hashes only, no birth data or PDFs.
      - {type: bind, source: "${SBK_STATE_DIR:?writable state directory}", target: /var/lib/sabpuja-commerce}
    networks: [commerce]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/healthz',timeout=4).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  gateway:
    image: nginx:1.28.0-alpine
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    network_mode: "service:commerce"
    depends_on:
      commerce: {condition: service_healthy}
    volumes:
      - {type: bind, source: ./gateway.nginx.conf, target: /etc/nginx/nginx.conf, read_only: true}
      - {type: bind, source: "${SBK_TRUSTED_PROXY_FILE:?set_real_ip_from line for the HTTPS edge}", target: /etc/nginx/trusted-proxy.conf, read_only: true}

networks:
  commerce:
    name: ${SBK_NETWORK:-sabpuja-commerce-qa}

# Internal-only client-preview gateway. Real HTTPS is terminated only by
# a separately owner-approved edge router. No published host port in Compose.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_request_buffering on;
  # The deployment's exact HTTPS Origin(s) come from an operator file, so the
  # hostname is configuration, not a hand edit (see preview/gateway/).
  map $http_origin $bad_origin {
    default 1;
    "" 0;
    include /etc/nginx/preview-allowed-origins.map;
  }
  # Only a proxy named in the trusted-proxy file may supply the client address.
  # With recursion off, the last X-Forwarded-For entry (the one the trusted
  # proxy appended) is used; addresses a client forges earlier are ignored.
  # With no set_real_ip_from line, X-Forwarded-For is ignored entirely.
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  include /etc/nginx/preview-trusted-proxy.conf;
  # Privacy-safe security event log (KUN-SEC-AUTHLOG-001). Every field is a
  # bounded class chosen by the gateway: time, status, event, method class,
  # path class, whether Basic credentials were sent, upstream status and
  # duration. It never contains the user name ($remote_user), the
  # Authorization header, the URI or query string, the body, the client
  # address or any other client-supplied text. Only refusals and 5xx are logged.
  map $status $sabpuja_event {
    default "";
    400 bad_request;
    401 auth_failed;
    403 forbidden;
    413 body_too_large;
    429 rate_limited;
    ~^5 server_error;
  }
  map $request_method $sabpuja_method {
    default other;
    GET GET;
    HEAD HEAD;
    POST POST;
    OPTIONS OPTIONS;
  }
  map $uri $sabpuja_path {
    default other;
    / page;
    /api/places places;
    /api/chart chart;
    /api/report report;
    ~^/static/ static;
  }
  map $http_authorization $sabpuja_auth_input {
    default other_scheme;
    "" none;
    "~*^basic " basic;
  }
  log_format sabpuja_security 'sabpuja_security time=$time_iso8601 event=$sabpuja_event status=$status method=$sabpuja_method path=$sabpuja_path auth_input=$sabpuja_auth_input upstream_status=$upstream_status request_time=$request_time';
  limit_req_zone $binary_remote_addr zone=preview_ip:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=preview_chart:1m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=preview_conn:1m;
  server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    access_log /dev/stdout sabpuja_security if=$sabpuja_event;
    limit_req zone=preview_ip burst=40 nodelay;
    limit_req_status 429;
    limit_conn preview_conn 20;
    limit_conn_status 429;
    # Basic Auth runs in the loopback-only auth server below (KUN-SEC-AUTHLOG-001).
    # Nginx's auth_basic logs every failed login's submitted user name at error
    # level, and a password typed into the user name box would land in the log.
    # The auth server's log keeps only crit and above, so this server keeps its
    # warn-level log for throttling, upstream and other operational errors, and
    # each refused login is still recorded as a sabpuja_security auth_failed line.
    # On 401, auth_request passes the auth server's WWW-Authenticate challenge on.
    auth_request /_sabpuja_auth;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($bad_origin) { return 403; }
    location = /_sabpuja_auth {
      internal;
      auth_request off;
      proxy_pass http://127.0.0.1:8081;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host "127.0.0.1:8081";
      proxy_connect_timeout 4s;
      proxy_read_timeout 4s;
    }
    location = /api/chart {
      limit_req zone=preview_chart burst=3 nodelay;
      proxy_set_header Host "127.0.0.1:8765";
      proxy_set_header Origin "http://127.0.0.1:8765";
      proxy_hide_header Server;
      proxy_pass http://127.0.0.1:8765;
    }
    # PDF requests are separately throttled from page assets.
    location = /api/report {
      limit_req zone=preview_chart burst=1 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Host "127.0.0.1:8765";
      proxy_set_header Origin "http://127.0.0.1:8765";
      proxy_hide_header Server;
      proxy_connect_timeout 4s;
      proxy_read_timeout 30s;
      proxy_pass http://127.0.0.1:8765;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host "127.0.0.1:8765";
      proxy_set_header Origin "http://127.0.0.1:8765";
      proxy_set_header Connection "";
      proxy_hide_header Server;
      proxy_connect_timeout 4s;
      proxy_read_timeout 20s;
      proxy_send_timeout 20s;
      proxy_pass http://127.0.0.1:8765;
    }
  }
  # Credential check only, reachable on loopback inside the gateway's network
  # namespace. Answers 204 for a valid htpasswd login and 401 with the Basic
  # challenge otherwise. Its log keeps crit and above only, so failed logins
  # leave no user name (or mistyped password) in any log.
  server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;
    error_log /dev/stderr crit;
    location = /_sabpuja_auth {
      auth_basic "Sabpuja private client preview";
      auth_basic_user_file /etc/nginx/private-htpasswd;
      try_files /no-such-file =204;
    }
    location / { return 404; }
  }
}

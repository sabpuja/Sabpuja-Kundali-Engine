# Internal-only client-preview gateway. Real HTTPS is terminated only by
# a separately owner-approved edge router. No published host port in Compose.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  proxy_request_buffering on;
  map $http_origin $bad_origin {
    default 1;
    "" 0;
    "https://kundali-preview.sabpuja.com" 0;
  }
  limit_req_zone $binary_remote_addr zone=preview_ip:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=preview_chart:1m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=preview_conn:1m;
  server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req zone=preview_ip burst=40 nodelay;
    limit_req_status 429;
    limit_conn preview_conn 20;
    limit_conn_status 429;
    auth_basic "Sabpuja private client preview";
    auth_basic_user_file /etc/nginx/private-htpasswd;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($bad_origin) { return 403; }
    location = /api/chart {
      limit_req zone=preview_chart burst=3 nodelay;
      proxy_set_header Host "127.0.0.1:8765";
      proxy_set_header Origin "http://127.0.0.1:8765";
      proxy_hide_header Server;
      proxy_pass http://127.0.0.1:8765;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host "127.0.0.1:8765";
      proxy_set_header Origin "http://127.0.0.1:8765";
      proxy_set_header Connection "";
      proxy_hide_header Server;
      proxy_connect_timeout 4s;
      proxy_read_timeout 20s;
      proxy_send_timeout 20s;
      proxy_pass http://127.0.0.1:8765;
    }
  }
}

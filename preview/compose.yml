# PREPARATION ONLY. Do not deploy to real edge without separate owner authorization.
name: sabpuja-kundali-private-preview
services:
  engine:
    build:
      context: ..
      dockerfile: preview/Dockerfile
    image: sabpuja-kundali-private-preview:gate3e
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      SABPUJA_EPHE_PATH: /opt/kundali/ephe
    volumes:
      - type: bind
        source: ${SABPUJA_PREVIEW_EPHE_DIR:?Set the verified ephemeris directory}
        target: /opt/kundali/ephe
        read_only: true
    networks:
      edge:
        aliases: [sabpuja-kundali-preview]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/places',timeout=4).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  gateway:
    image: nginx:1.28.0-alpine
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    network_mode: "service:engine"
    depends_on:
      engine:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Gateway.nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${SABPUJA_PREVIEW_HTPASSWD_FILE:?Set protected Basic Auth htpasswd file}
        target: /etc/nginx/private-htpasswd
        read_only: true
      - type: bind
        source: ${SABPUJA_PREVIEW_ALLOWED_ORIGINS_FILE:?Set the allowed HTTPS Origin map file}
        target: /etc/nginx/preview-allowed-origins.map
        read_only: true
      - type: bind
        source: ${SABPUJA_PREVIEW_TRUSTED_PROXY_FILE:?Set the trusted proxy file}
        target: /etc/nginx/preview-trusted-proxy.conf
        read_only: true

networks:
  edge:
    external: true
    name: ${SABPUJA_PREVIEW_NETWORK:-edge}
